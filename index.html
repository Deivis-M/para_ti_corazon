<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Para ti ❤</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Fondo de partículas / corazones flotantes (se llena por JS, en todas las páginas) -->
<div id="fondo-particulas"></div>

<!-- Barra de progreso decorativa -->
<div id="barra-progreso"><div id="barra-progreso-fill"></div></div>

<!-- ================= PÁGINA 1 ================= -->
<div class="page active" id="page1">
  <div class="corazon-gigante" id="corazonGigante">❤</div>
  <div class="glass-card fade-in-up">
    <p class="etiqueta">✧ ✦ antes de nada ✦ ✧</p>
    <h1 class="titulo titulo-arcoiris">Léeme con calma</h1>
    <div id="frase-container">
      <p id="frase"><span id="frase-texto"></span><span class="cursor">|</span></p>
    </div>
    <button class="btn btn-primario" id="btnContinuar">
      <span>Continuar</span>
    </button>
  </div>
</div>

<!-- ================= PÁGINA 2 ================= -->
<div class="page" id="page2">
  <div class="glass-card fade-in-up">
    <p class="etiqueta">✧ tengo que preguntarte algo ✧</p>
    <h1 class="titulo titulo-pequeno">¿Te gustaría darnos una nueva oportunidad?</h1>
    <div id="zona-botones">
      <button id="btnSi" class="btn btn-primario btn-latido">
        <span>Sí</span>
      </button>
      <button id="btnNo" class="btn btn-fantasma">
        <span>No</span>
        <span id="globo-no"></span>
      </button>
    </div>
    <p id="contador-intentos"></p>
  </div>
</div>

<!-- ================= PÁGINA 3 ================= -->
<div class="page" id="page3">
  <div class="contenido-final fade-in-up">

    <!-- ===== FASE 1: mensajes grandes, uno a uno, antes del rompecabezas ===== -->
    <div id="fase-mensajes" class="fase-mensajes">
      <p class="etiqueta">✧ gracias por decir que sí ✧</p>
      <p id="mensaje-grande" class="mensaje-grande"></p>
    </div>

    <!-- ===== FASE 2: rompecabezas (oculto hasta que terminen los mensajes) ===== -->
    <div id="fase-rompecabezas" class="fase-rompecabezas oculto">
      <p class="etiqueta">✧ gracias por decir que sí ✧</p>
      <h1 class="titulo titulo-arcoiris" id="titulo-final">Pieza por pieza</h1>

      <div id="glow-corazon"></div>

      <!-- ===== Corazón-rompecabezas real (SVG, 100% responsive) ===== -->
      <svg id="corazonSVG" viewBox="-16 -16 132 132" preserveAspectRatio="xMidYMid meet">
        <defs>
          <!-- silueta real del corazón: todas las piezas quedan recortadas dentro de ella -->
          <clipPath id="clipHeart" clipPathUnits="userSpaceOnUse">
            <path d="M50,16 C34,-6 -2,8 0,34 C2,58 26,74 50,96 C74,74 98,58 100,34 C102,8 66,-6 50,16 Z"/>
          </clipPath>
          <!-- 6 sectores rectangulares que dividen el corazón en 2 columnas x 3 filas -->
          <clipPath id="clipTL" clipPathUnits="userSpaceOnUse"><rect x="-20" y="-20" width="70" height="55"/></clipPath>
          <clipPath id="clipTR" clipPathUnits="userSpaceOnUse"><rect x="50" y="-20" width="70" height="55"/></clipPath>
          <clipPath id="clipML" clipPathUnits="userSpaceOnUse"><rect x="-20" y="35" width="70" height="30"/></clipPath>
          <clipPath id="clipMR" clipPathUnits="userSpaceOnUse"><rect x="50" y="35" width="70" height="30"/></clipPath>
          <clipPath id="clipBL" clipPathUnits="userSpaceOnUse"><rect x="-20" y="65" width="70" height="55"/></clipPath>
          <clipPath id="clipBR" clipPathUnits="userSpaceOnUse"><rect x="50" y="65" width="70" height="55"/></clipPath>
        </defs>

        <g id="piezaTL" class="pieza-svg" clip-path="url(#clipHeart)">
          <g clip-path="url(#clipTL)">
            <image id="imgTL" href="" x="0" y="-10" width="50" height="46" preserveAspectRatio="xMidYMid slice"/>
            <rect class="borde-pieza" x="-20" y="-20" width="70" height="55"/>
          </g>
        </g>
        <g id="piezaTR" class="pieza-svg" clip-path="url(#clipHeart)">
          <g clip-path="url(#clipTR)">
            <image id="imgTR" href="" x="50" y="-10" width="50" height="46" preserveAspectRatio="xMidYMid slice"/>
            <rect class="borde-pieza" x="50" y="-20" width="70" height="55"/>
          </g>
        </g>
        <g id="piezaML" class="pieza-svg" clip-path="url(#clipHeart)">
          <g clip-path="url(#clipML)">
            <image id="imgML" href="" x="0" y="30" width="50" height="38" preserveAspectRatio="xMidYMid slice"/>
            <rect class="borde-pieza" x="-20" y="35" width="70" height="30"/>
          </g>
        </g>
        <g id="piezaMR" class="pieza-svg" clip-path="url(#clipHeart)">
          <g clip-path="url(#clipMR)">
            <image id="imgMR" href="" x="50" y="30" width="50" height="38" preserveAspectRatio="xMidYMid slice"/>
            <rect class="borde-pieza" x="50" y="35" width="70" height="30"/>
          </g>
        </g>
        <g id="piezaBL" class="pieza-svg" clip-path="url(#clipHeart)">
          <g clip-path="url(#clipBL)">
            <image id="imgBL" href="" x="0" y="60" width="50" height="42" preserveAspectRatio="xMidYMid slice"/>
            <rect class="borde-pieza" x="-20" y="65" width="70" height="55"/>
          </g>
        </g>
        <g id="piezaBR" class="pieza-svg" clip-path="url(#clipHeart)">
          <g clip-path="url(#clipBR)">
            <image id="imgBR" href="" x="50" y="60" width="50" height="42" preserveAspectRatio="xMidYMid slice"/>
            <rect class="borde-pieza" x="50" y="65" width="70" height="55"/>
          </g>
        </g>
      </svg>

      <div id="ecualizador">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>

      <p id="mensaje-fin"></p>
    </div>

  </div>
</div>

<audio id="bgMusic" preload="auto">
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<button id="btnMute" title="silenciar / activar música">🔊</button>

<script src="script.js"></script>
</body>
</html>
