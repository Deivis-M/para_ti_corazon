<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Para ti ❤</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Recorte de corazón reutilizable para todas las fotos con forma de corazón -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <clipPath id="heartClipShared" clipPathUnits="objectBoundingBox">
      <path d="M0.50,0.16 C0.34,-0.06 -0.02,0.08 0,0.34 C0.02,0.58 0.26,0.74 0.50,0.96 C0.74,0.74 0.98,0.58 1.00,0.34 C1.02,0.08 0.66,-0.06 0.50,0.16 Z"/>
    </clipPath>
  </defs>
</svg>


<!-- Fondo de partículas / corazones flotantes (se llena por JS, en todas las páginas) -->
<div id="fondo-particulas"></div>

<!-- Barra de progreso decorativa -->
<div id="barra-progreso"><div id="barra-progreso-fill"></div></div>

<!-- ================= PÁGINA 1 ================= -->
<div class="page active" id="page1">
  <div class="corazon-gigante" id="corazonGigante">❤</div>
  <div class="glass-card fade-in-up">
    <p class="etiqueta">✧ ✦ antes de nada ✦ ✧</p>
    <h1 class="titulo titulo-arcoiris">Léeme con calma</h1>
    <div id="frase-container">
      <p id="frase"><span id="frase-texto"></span><span class="cursor">|</span></p>
    </div>
    <button class="btn btn-primario" id="btnContinuar">
      <span>Continuar</span>
    </button>
  </div>
</div>

<!-- ================= PÁGINA 2 ================= -->
<div class="page" id="page2">
  <div class="glass-card fade-in-up">
    <p class="etiqueta">✧ tengo que preguntarte algo ✧</p>
    <h1 class="titulo titulo-pequeno">¿Te gustaría darnos una nueva oportunidad?</h1>
    <div id="zona-botones">
      <button id="btnSi" class="btn btn-primario btn-latido">
        <span>Sí</span>
      </button>
      <button id="btnNo" class="btn btn-fantasma">
        <span>No</span>
        <span id="globo-no"></span>
      </button>
    </div>
    <p id="contador-intentos"></p>
  </div>
</div>

<!-- ================= PÁGINA 3 ================= -->
<div class="page" id="page3">
  <div class="contenido-final fade-in-up">

    <!-- ===== FASE 1: mensajes grandes, uno a uno, antes del rompecabezas ===== -->
    <div id="fase-mensajes" class="fase-mensajes">
      <p class="etiqueta">✧ gracias por decir que sí ✧</p>
      <div class="foto-mensaje-wrap">
        <img id="foto-mensaje" class="foto-mensaje" src="" alt="">
      </div>
      <p id="mensaje-grande" class="mensaje-grande"></p>
    </div>

    <!-- ===== FASE 2: rompecabezas (oculto hasta que terminen los mensajes) ===== -->
    <div id="fase-rompecabezas" class="fase-rompecabezas oculto">
      <p class="etiqueta">✧ gracias por decir que sí ✧</p>
      <h1 class="titulo titulo-arcoiris" id="titulo-final">Pieza por pieza</h1>

      <div id="glow-corazon"></div>

      <!-- ===== Corazón formado por 10 mini-fotos con forma de corazón (se llena por JS) ===== -->
      <div id="corazonMosaico"></div>

      <div id="ecualizador">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>

      <p id="mensaje-fin"></p>
    </div>

  </div>
</div>

<audio id="bgMusic" preload="auto">
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<button id="btnMute" title="silenciar / activar música">🔊</button>

<script src="script.js"></script>
</body>
</html>
